[package]

# Semantic Versioning is used: https://semver.org/
version = "0.1.0"

# Description
category = "isaaclab"
readme  = "README.md"

title = "EngineAI RL Lab"
author = "EngineAI Robotics"
maintainer = "EngineAI Robotics"
description = "Isaac Lab environments for EngineAI robot reinforcement learning and whole-body tracking"
repository = "https://github.com/engineai-robotics/engineai_rl_lab.git"
keywords = ["robotics", "reinforcement-learning", "whole-body-tracking", "isaaclab", "newton"]

[dependencies]
"isaaclab" = {}
"isaaclab_newton" = {}
"isaaclab_ov" = {}
"isaaclab_physx" = {}
"isaaclab_rl" = {}
"isaaclab_tasks" = {}

[[python.module]]
name = "engineai_rl_lab"

# Keep the Kit-only UI module separate so importing the package remains valid in Newton kit-less runs.
[[python.module]]
name = "engineai_rl_lab.ui_extension_example"

